name: Deploy VectorCraft to GitHub Pages

on:
  push:
    branches: ["web-build"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: Build WebAssembly dari source code
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Download & Install Trunk
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf- -C /tmp/
          sudo mv /tmp/trunk /usr/local/bin/trunk

      - name: Build Web with Trunk
        working-directory: apps/vectorcraft-web
        run: |
          trunk build --release

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Ubah path dari '.' menjadi folder output Trunk
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  # Job 2: Deploy biner ke GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
