name: Build and Deploy VectorCraft to Cloudflare Pages

on:
  push:
    branches:
      - main
      - web-build
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Download & Install Trunk
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf- -C /tmp/
          sudo mv /tmp/trunk /usr/local/bin/trunk

      - name: Build Web with Trunk
        working-directory: apps/vectorcraft-web
        run: |
          trunk build --release

      - name: Create Cloudflare Pages _headers
        run: |
          cat << 'EOF' > dist/web/_headers
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
          EOF
          echo "=== Verifikasi isi dist/web/_headers ==="
          cat dist/web/_headers
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            npx wrangler pages project create vectorcraft --production-branch=main || true
            npx wrangler pages deploy dist/web --project-name=vectorcraft
